{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Juventud Renovadora UNAMOS — Nicaragua{% endblock %}</title>
  <meta name="description"
    content="{% block description %}Espacio de información, participación y actividades de la juventud de Unamos, Nicaragua.{% endblock %}">
  <meta name="theme-color" content="#F97316">
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  <meta property="og:site_name" content="Juventud Renovadora UNAMOS">
  <meta property="og:title" content="{% block og_title %}Juventud Renovadora UNAMOS — Nicaragua{% endblock %}">
  <meta property="og:description"
    content="{% block og_description %}Espacio de información, participación y actividades de la juventud de Unamos, Nicaragua.{% endblock %}">
  <meta property="og:locale" content="es_NI">
  <link rel="icon" type="image/svg+xml" href="{% static 'img/logos/favicon.svg' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
  <script>document.documentElement.classList.add('js');</script>
</head>

<body>
  {% include "partials/iconos.html" %}
  <a class="salto-contenido" href="#contenido">Saltar al contenido</a>

  {% include "partials/encabezado.html" %}

  <main id="contenido"{% if not cabecera_transparente %} class="pt-[var(--header-h)]"{% endif %}>
    {% block content %}{% endblock %}
  </main>

  {% include "partials/pie.html" %}

  <script src="{% static 'js/vendor/lenis.min.js' %}" defer></script>
  <script src="{% static 'js/main.js' %}" defer></script>
</body>

</html>
